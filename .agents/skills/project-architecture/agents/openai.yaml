interface:
  display_name: "Aura Forge — Architecture technique"
  short_description: "Conçoit le socle MVP et les évolutions techniques proportionnées"
  default_prompt: "Utilise $project-architecture pour réutiliser ou faire évoluer l'architecture approuvée du MVP et ses livraisons progressives, comparer les choix structurants indépendamment des outils installés, faire valider les décisions et préparer la planification sans imposer de version, coder, créer d'Issues ni effectuer de commit ou de push sans autorisation distincte."
policy:
